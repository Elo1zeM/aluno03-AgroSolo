
name: Gerar APK AgroSolo

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Compilar React
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Preparar Gradle
        run: chmod +x android/gradlew

      - name: Diagnosticar Manifest
        run: |
          python -c "from pathlib import Path; p=Path('android/app/src/main/AndroidManifest.xml'); b=p.read_bytes(); print('PRIMEIROS BYTES:', repr(b[:100])); print('PRIMEIRAS LINHAS:'); [print(f'{i}: {line!r}') for i, line in enumerate(b.decode('utf-8', errors='replace').splitlines()[:8], 1)]"
          python -c "import xml.etree.ElementTree as ET; ET.parse('android/app/src/main/AndroidManifest.xml'); print('XML valido')"

      - name: Gerar APK
        run: cd android && ./gradlew assembleDebug --stacktrace --info

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AgroSolo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
